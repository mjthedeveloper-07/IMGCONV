{% extends "admin_layout.html" %}
{% block title %}Company Profile - GM CAR A/C SERVICE &amp; MULTIBRAND BILLING{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Company Profile</h1>
</div>
<form method="post" class="form-block">
  <div class="grid two">
    <div>
      <label>Company Name</label>
      <input type="text" name="company_name" value="{{ settings.company_name }}" />
    </div>
    <div>
      <label>Address Line 1</label>
      <input type="text" name="company_address_line1" value="{{ settings.company_address_line1 }}" />
    </div>
    <div>
      <label>Address Line 2</label>
      <input type="text" name="company_address_line2" value="{{ settings.company_address_line2 }}" />
    </div>
    <div>
      <label>Phone</label>
      <input type="text" name="company_phone" value="{{ settings.company_phone }}" />
    </div>
    <div>
      <label>Email</label>
      <input type="email" name="company_email" value="{{ settings.company_email }}" />
    </div>
    <div>
      <label>Website</label>
      <input type="text" name="company_website" value="{{ settings.company_website }}" />
    </div>
  </div>
  <button type="submit" class="button">Save Company Profile</button>
</form>
{% endblock %}
