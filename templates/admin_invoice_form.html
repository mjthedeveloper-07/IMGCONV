{% extends "admin_layout.html" %}
{% block title %}New Invoice - GM CAR A/C SERVICE &amp; MULTIBRAND BILLING{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Create Invoice</h1>
</div>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" class="form-block">
  <div class="grid two">
    <div>
      <label>Customer</label>
      <select name="customer_id" id="customer-select">
        <option value="new">New Customer</option>
        {% for customer in customers %}
        <option value="{{ customer.id }}">{{ customer.name }}</option>
        {% endfor %}
      </select>
      <label>Customer Name</label>
      <input type="text" name="customer_name" />
      <label>Phone</label>
      <input type="text" name="customer_phone" />
      <label>Vehicle</label>
      <input type="text" name="customer_vehicle" />
      <label>Vehicle Number</label>
      <input type="text" name="customer_vehicle_number" />
    </div>
    <div>
      <label>Invoice Date</label>
      <input type="date" name="invoice_date" value="{{ default_date }}" />
      <label>GST Mode</label>
      <select name="gst_enabled">
        <option value="yes">GST Enabled</option>
        <option value="no">GST Disabled</option>
      </select>
      <label>GST Type</label>
      <select name="gst_type">
        <option value="cgst_sgst" {% if settings.gst_default_type == 'cgst_sgst' %}selected{% endif %}>CGST + SGST</option>
        <option value="igst" {% if settings.gst_default_type == 'igst' %}selected{% endif %}>IGST</option>
      </select>
      <label>CGST Rate (%)</label>
      <input type="number" step="0.01" name="cgst_rate" value="{{ settings.gst_cgst_rate }}" />
      <label>SGST Rate (%)</label>
      <input type="number" step="0.01" name="sgst_rate" value="{{ settings.gst_sgst_rate }}" />
      <label>IGST Rate (%)</label>
      <input type="number" step="0.01" name="igst_rate" value="{{ settings.gst_igst_rate }}" />
    </div>
  </div>

  <h2>Service Items</h2>
  <div id="items">
    <div class="item-row">
      <input type="text" name="item_description" placeholder="Description" />
      <input type="number" step="0.01" name="item_amount" placeholder="Amount" />
    </div>
  </div>
  <button type="button" class="button secondary" onclick="addItem()">Add Item</button>

  <h2>Payment</h2>
  <label>Amount Paid</label>
  <input type="number" step="0.01" name="amount_paid" value="0" />
  <label>Payment Method</label>
  <select name="payment_method">
    <option value="Cash">Cash</option>
    <option value="UPI">UPI</option>
    <option value="Card">Card</option>
  </select>

  <button type="submit" class="button">Create Invoice</button>
</form>
<script>
  function addItem() {
    const container = document.getElementById('items');
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = '<input type="text" name="item_description" placeholder="Description" />' +
      '<input type="number" step="0.01" name="item_amount" placeholder="Amount" />';
    container.appendChild(row);
  }
</script>
{% endblock %}
