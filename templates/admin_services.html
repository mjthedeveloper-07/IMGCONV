{% extends "admin_layout.html" %}
{% block title %}Services - GM CAR A/C SERVICE &amp; MULTIBRAND BILLING{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Services</h1>
</div>
<form method="post" class="form-block">
  <h2>Add Service</h2>
  <div class="grid two">
    <div>
      <label>Description</label>
      <input type="text" name="description" />
    </div>
    <div>
      <label>Price</label>
      <input type="number" step="0.01" name="price" />
    </div>
  </div>
  <button type="submit" class="button">Save</button>
</form>
<h2>Service List</h2>
<table class="data-table">
  <thead>
    <tr>
      <th>Description</th>
      <th>Price</th>
      <th>Update</th>
    </tr>
  </thead>
  <tbody>
    {% for service in services %}
    <tr>
      <form method="post" action="{{ url_for('admin_service_update', service_id=service.id) }}">
        <td><input type="text" name="description" value="{{ service.description }}" /></td>
        <td><input type="number" step="0.01" name="price" value="{{ service.price }}" /></td>
        <td><button type="submit">Update</button></td>
      </form>
    </tr>
    {% else %}
    <tr>
      <td colspan="3">No services added yet.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
